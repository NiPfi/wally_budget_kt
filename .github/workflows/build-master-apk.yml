name: Build Main Release Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main-release-artifacts
  cancel-in-progress: true

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_RELEASE_KEYSTORE_BASE64 is not configured." >&2
            exit 1
          fi

          echo "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/wallybudget-release.keystore"

      - name: Build signed release bundle
        env:
          WALLYBUDGET_RELEASE_STORE_FILE: ${{ runner.temp }}/wallybudget-release.keystore
          WALLYBUDGET_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          WALLYBUDGET_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          WALLYBUDGET_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "${WALLYBUDGET_RELEASE_STORE_PASSWORD}"
          test -n "${WALLYBUDGET_RELEASE_KEY_ALIAS}"
          test -n "${WALLYBUDGET_RELEASE_KEY_PASSWORD}"
          ./gradlew :app:bundleRelease

      - name: Build signed ABI-split release APKs
        env:
          WALLYBUDGET_RELEASE_STORE_FILE: ${{ runner.temp }}/wallybudget-release.keystore
          WALLYBUDGET_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          WALLYBUDGET_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          WALLYBUDGET_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew -Pwallybudget.enableAbiSplits=true :app:assembleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            filename="$(basename "${apk}")"
            cp "${apk}" "dist/WallyBudget-main-${GITHUB_SHA}-${filename}"
          done
          cp app/build/outputs/bundle/release/app-release.aab "dist/WallyBudget-main-${GITHUB_SHA}-release.aab"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: WallyBudget-main-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Generate release notes
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          github_sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          notes_path = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"

          def gh_json(*args):
              completed = subprocess.run(
                  ["gh", "api", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(completed.stdout)

          def strip_template_hints(text: str) -> str:
              text = re.sub(
                  r"(?im)^\s*-\s+Describe the user-visible changes in this PR\.\s*$",
                  "",
                  text,
              )
              text = re.sub(
                  r"(?im)^\s*-\s+Keep this short and release-note ready\.\s*$",
                  "",
                  text,
              )
              return text.strip()

          def extract_section(body: str, headings: tuple[str, ...]) -> str:
              for heading in headings:
                  match = re.search(
                      rf"(?ims)^#{{1,6}}\s+{re.escape(heading)}\s*$\n(.*?)(?=^#{{1,6}}\s+|\Z)",
                      body or "",
                  )
                  if match:
                      section = strip_template_hints(match.group(1))
                      if section:
                          return section
              return ""

          def extract_leading_block(body: str) -> str:
              lines = (body or "").splitlines()
              block_lines = []
              in_block = False

              for line in lines:
                  if not in_block:
                      if not line.strip():
                          continue
                      if re.match(r"^#{1,6}\s+", line):
                          continue
                      in_block = True

                  if re.match(r"^#{1,6}\s+", line):
                      break

                  block_lines.append(line)

              return strip_template_hints("\n".join(block_lines))

          def extract_summary(body: str) -> str:
              summary = extract_section(body, ("Summary", "Changes", "Highlights"))
              if summary:
                  return summary
              return extract_leading_block(body)

          def no_summary_message() -> str:
              return "- No summary content was found in the merged PR body."

          pulls = gh_json(
              f"repos/{repo}/commits/{github_sha}/pulls",
              "-H",
              "Accept: application/vnd.github+json",
          )
          pr = pulls[0] if pulls else None

          lines = [f"Automated prerelease build for main commit `{github_sha}`.", ""]
          if pr:
              summary = extract_summary(pr.get("body", ""))
              lines.extend(
                  [
                      f"From PR #{pr['number']}: {pr['title']}",
                      "",
                  ]
              )
              summary = extract_summary(pr.get("body", ""))
              if summary:
                  lines.extend(["## Changes", summary, ""])
              else:
                  lines.extend(
                      [
                          "## Changes",
                          no_summary_message(),
                          "",
                      ]
                  )
          else:
              lines.extend(
                  [
                      "## Changes",
                      "- No pull request was associated with this main commit.",
                      "",
                  ]
              )

          lines.append("## Artifacts")
          for artifact in sorted(Path("dist").iterdir()):
              if artifact.is_file():
                  lines.append(f"- {artifact.name}")

          notes_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(notes_path)
          PY

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: main-${{ github.sha }}
        run: |
          release_title="Main prerelease ${GITHUB_SHA}"
          release_notes="${RUNNER_TEMP}/release-notes.md"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${release_title}" \
              --notes-file "${release_notes}" \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes-file "${release_notes}" \
              --prerelease
          fi

          gh release upload "${RELEASE_TAG}" dist/* --clobber

      - name: Add workflow summary
        run: |
          {
            echo "## Signed Release Artifacts"
            echo
            echo "- Branch: \`main\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`WallyBudget-main-release-${GITHUB_SHA}\`"
            echo "- GitHub prerelease: \`main-${GITHUB_SHA}\`"
            echo "- APK files: one per ABI from \`app/build/outputs/apk/release/\`"
            echo "- App Bundle file: \`WallyBudget-main-${GITHUB_SHA}-release.aab\`"
          } >> "${GITHUB_STEP_SUMMARY}"
