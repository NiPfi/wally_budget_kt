name: Build Master Release Artifacts

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-master-release-artifacts
  cancel-in-progress: true

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_RELEASE_KEYSTORE_BASE64 is not configured." >&2
            exit 1
          fi

          echo "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/wallybudget-release.keystore"

      - name: Build signed release APK and bundle
        env:
          WALLYBUDGET_RELEASE_STORE_FILE: ${{ runner.temp }}/wallybudget-release.keystore
          WALLYBUDGET_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          WALLYBUDGET_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          WALLYBUDGET_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "${WALLYBUDGET_RELEASE_STORE_PASSWORD}"
          test -n "${WALLYBUDGET_RELEASE_KEY_ALIAS}"
          test -n "${WALLYBUDGET_RELEASE_KEY_PASSWORD}"
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/WallyBudget-master-${GITHUB_SHA}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/WallyBudget-master-${GITHUB_SHA}-release.aab"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: WallyBudget-master-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Add workflow summary
        run: |
          {
            echo "## Signed Release Artifacts"
            echo
            echo "- Branch: \`master\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`WallyBudget-master-release-${GITHUB_SHA}\`"
            echo "- APK file: \`WallyBudget-master-${GITHUB_SHA}-release.apk\`"
            echo "- App Bundle file: \`WallyBudget-master-${GITHUB_SHA}-release.aab\`"
          } >> "${GITHUB_STEP_SUMMARY}"
