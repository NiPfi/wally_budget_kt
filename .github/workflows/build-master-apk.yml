name: Build Master APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-master-apk
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/WallyBudget-master-${GITHUB_SHA}.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: WallyBudget-master-apk-${{ github.sha }}
          path: dist/WallyBudget-master-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add workflow summary
        run: |
          {
            echo "## Installable APK"
            echo
            echo "- Branch: \`master\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`WallyBudget-master-apk-${GITHUB_SHA}\`"
            echo "- APK file: \`WallyBudget-master-${GITHUB_SHA}.apk\`"
          } >> "${GITHUB_STEP_SUMMARY}"
