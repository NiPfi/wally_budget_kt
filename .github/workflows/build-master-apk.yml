name: Build Master APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-master-apk
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest master
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/WallyBudget-master-${GITHUB_SHA}.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: WallyBudget-master-apk-${{ github.sha }}
          path: dist/WallyBudget-master-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add workflow summary
        run: |
          {
            echo "## Installable APK"
            echo
            echo "- Branch: \`master\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`WallyBudget-master-apk-${GITHUB_SHA}\`"
            echo "- APK file: \`WallyBudget-master-${GITHUB_SHA}.apk\`"
          } >> "${GITHUB_STEP_SUMMARY}"
